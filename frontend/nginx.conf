server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;      # 允許上傳圖片/文件

    # 帶 hash 的建置產物（assets/index-XXXX.js/css）內容不變、改版換檔名，可永久快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 一律要重新驗證：改版後 index.html 會指向新 hash 的 bundle，
    # 不快取才不會卡在舊版（就是之前一直要 Ctrl+Shift+R 的原因）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / { try_files $uri $uri/ /index.html; }

    # API 同源反代到 backend
    location ~ ^/(auth|workspaces|conversations|memories|skills|models|uploads|chat|attachments) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;           # /chat 是 SSE，關緩衝才即時
        proxy_read_timeout 3600s;
    }
}
